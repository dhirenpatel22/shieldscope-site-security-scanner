name: Deploy to WordPress.org

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
# 0. VERIFY — runs on every push, pull request and version tag.
#    bin/verify-release.sh: conflict markers, version consistency, php -l on
#    PHP 7.4 and 8.4, PHPUnit, and (on a tag) the tag must be on main.
#    Both deploy jobs below need it to pass.
#
# 1. RELEASE DEPLOY — fires whenever you push a version tag (e.g. 1.3.0).
#    Deploys code + assets to SVN trunk AND creates a matching SVN tag.
#
# 2. ASSET/README-ONLY UPDATE — fires on every push to main.
#    Only deploys if the push touches .wordpress-org/** or readme.txt.
#    Updates SVN trunk + assets WITHOUT creating a new SVN tag (no version bump).
#    Useful for fixing typos in readme.txt or swapping a banner image.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # matches 1.3.0, 2.0.0, etc.
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 0: Verify (every push, pull request and tag) ──────────────────────
  verify:
    name: Verify (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.4' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so a tag can be checked against origin/main.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:9.6
          coverage: none

      - name: Run release checks
        run: bin/verify-release.sh

  # ── Job 1: Full plugin release (triggered by version tag) ─────────────────
  release:
    name: Release to WordPress.org
    needs: verify
    runs-on: ubuntu-latest
    # Only run this job when a tag was pushed (not on branch pushes)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No build step needed — pure PHP plugin, no npm/composer required.
      # If you ever add a build step (e.g. SCSS compilation), add it here.

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # SLUG defaults to the GitHub repo name, which already matches WP.org.
          # Uncomment and set manually only if they ever differ:
          # SLUG: shieldscope-site-security-scanner

  # ── Job 2: Asset / readme-only update (triggered by push to main) ─────────
  asset-update:
    name: Update assets & readme on WordPress.org
    needs: verify
    runs-on: ubuntu-latest
    # Only run this job on pushes to main (not on tags, other branches or PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The push trigger no longer filters on paths (verify must run on every
      # push), so only deploy when this push touched .wordpress-org/** or readme.txt.
      - name: Check for readme or asset changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No previous commit to compare against; skipping asset update."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- readme.txt .wordpress-org)"
            if [ -n "$changed" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update assets and readme on WordPress.org
        if: steps.changes.outputs.deploy == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # IGNORE_OTHER_FILES=true means: only readme.txt and the assets are
          # copied to SVN; changes to any other file in this push are ignored
          # and not committed (10up README). With false, the action instead
          # bails if anything other than assets and readme.txt changed.
          IGNORE_OTHER_FILES: true
