# False-positive corpus (S-25): runs ShieldScope's code rules over pinned,
# well-known plugins (tests/corpus/manifest.json, sha256-checked) and fails
# if any rule reports Critical or High. Read-only; deploys nothing.
name: False-positive corpus

on:
  pull_request:
  push:
    branches: [ main, develop ]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, mbstring, dom

      - name: Run corpus
        run: php bin/fp-corpus.php
